name: Generate signing keystore (run once)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and encrypt it
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ "${#STORE_PASSWORD}" -lt 12 ]; then
            echo "::error::Сначала создай секрет STORE_PASSWORD (минимум 12 символов): Settings → Secrets and variables → Actions"
            exit 1
          fi
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
            -alias defi-analytics -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=DeFi Analytics, O=Losiev, C=GE" \
            -storepass:env STORE_PASSWORD -keypass:env STORE_PASSWORD
          echo "=== Отпечатки (пригодятся для Play Console) ==="
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias defi-analytics \
            -storepass:env STORE_PASSWORD | grep -E "SHA1|SHA256"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:STORE_PASSWORD \
            -in "$RUNNER_TEMP/release.jks" -out "$RUNNER_TEMP/ks.enc"
          shred -u "$RUNNER_TEMP/release.jks"
          echo
          echo "=== Скопируй всё между линиями в секрет KEYSTORE_ENC ==="
          echo "-----BEGIN-----"
          base64 -w0 "$RUNNER_TEMP/ks.enc"
          echo
          echo "-----END-----"
          echo "Файл зашифрован паролем STORE_PASSWORD. Без этого пароля он бесполезен."
